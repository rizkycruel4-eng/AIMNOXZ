name: Build AimNoxZ

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: gradle assembleP25Debug assembleP56Debug assembleP73Debug assembleP98Debug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: AimNoxZ-debug-apks
          path: app/build/outputs/apk/**/*.apk
